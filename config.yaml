# Kindle Deals Bot Configuration

sources:
  amazon:
    base_url: "https://www.amazon.com"
    sff_monthly_deals: "/b?ie=UTF8&node=17474490011"
    sff_todays_deals: "/Science-Fiction-Fantasy-Todays-Deals/s?rh=n:668010011,p_n_deal_type:23566064011"
    sff_best_sellers: "/Best-Sellers-Kindle-Store-Science-Fiction-Fantasy/zgbs/digital-text/668010011"
    daily_deals: "/gp/browse.html?node=6165851011"

filters:
  # Max price in USD (locale now forced to US).
  max_price: 4.99
  
  # BookBub-style limited-time gate: only surface books at least this % off
  # their list price (a real discount, not just a cheap price).
  min_savings_pct: 50
  
  # Genre keywords for title/description matching
  genres:
    - fantasy
    - science fiction
    - sci-fi
    - epic fantasy
    - urban fantasy
    - space opera
    - cyberpunk
    - dystopian
    - post-apocalyptic
    - sword and sorcery
    - grimdark
    - progression fantasy
    - litrpg
    - gamelit
    - dungeon
    - romantasy
    - paranormal
    - supernatural
    # Horror sub-genres
    - psychological horror
    - supernatural horror
    - gothic horror
    - cosmic horror
    - slasher horror
    - body horror
    - paranormal horror
    - dark fantasy
    # Thriller sub-genres
    - psychological thriller
    - supernatural thriller
    - crime thriller
    - legal thriller
    - spy thriller
    - techno-thriller
    - medical thriller
    - political thriller
  
  # Tracked authors (case-insensitive, supports fuzzy: "Sanderson" matches "Brandon Sanderson")
  tracked_authors:
    - Stephen King
    - Robin Hobb
    - Brandon Sanderson
    - Pierce Brown
    - Joe Abercrombie
    - Isaac Asimov
    - James S.A. Corey
    - John Gwynne

scraping:
  # engine: curl_cffi (default, battle-tested). lightpanda is DEPRECATED for
  # this stack — Amazon hard-blocks it on DEAL pages (HTTP 503 100%, t_4c79a713)
  # AND PRODUCT pages (validateCaptcha ~75%, t_f893b2c1). curl_cffi (chrome124
  # impersonation + US cookie jar) passes ~100% on both.
  engine: curl_cffi
  auto_fallback: true
  # product_engine: which transport fetches PRODUCT pages for enrichment.
  # curl_cffi (default): lightpanda's UA ("Lightpanda/1.0") is fingerprintable
  # by Amazon's bot detection, which serves the validateCaptcha interstitial on
  # ~75% of product-page requests (probabilistic; wait_ms doesn't help).
  # curl_cffi's chrome124 impersonation + US cookie jar passes ~100%.
  product_engine: curl_cffi
  lightpanda_bin: "/home/stefan/.local/bin/lightpanda"
  lightpanda_cookies: "/tmp/lightpanda-cookies.json"
  lightpanda_wait_ms: 6000
  lightpanda_retries: 1           # deprecated engine — single attempt, then curl_cffi fallback
  lightpanda_retry_backoff: [5, 15, 30]   # seconds between retry attempts
  # debug: true → per-URL failure dumps in the log (normal runs summarize per batch)
  debug: false
  request_delay: 4        # seconds between requests (curl_cffi engine); 4s + jitter 0.5-1.5x = 2-6s — raised from 2s to dodge Amazon 503 rate-limit
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    - "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Safari/605.1.15"
  max_books_per_source: 50

covers:
  enabled: true
  max_count: 10          # Telegram media group limit; cap to avoid spam
  dir: "data/covers"     # relative to project root
